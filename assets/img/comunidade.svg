<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Ilustração de uma comunidade reunida ao ar livre">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bde0fe"/>
      <stop offset="100%" stop-color="#e8f5ef"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#ceu)"/>

  <!-- sol -->
  <circle cx="540" cy="80" r="42" fill="#f4a261" opacity="0.9"/>

  <!-- chão -->
  <path d="M0 320 Q160 280 320 320 T640 320 L640 420 L0 420 Z" fill="#95d5b2"/>
  <path d="M0 360 Q160 330 320 360 T640 360 L640 420 L0 420 Z" fill="#74c69d"/>

  <!-- pessoas estilizadas -->
  <g fill="#0b6e4f">
    <circle cx="180" cy="240" r="22"/>
    <rect x="160" y="262" width="40" height="70" rx="10"/>

    <circle cx="260" cy="230" r="24"/>
    <rect x="238" y="254" width="44" height="78" rx="12"/>

    <circle cx="340" cy="238" r="21"/>
    <rect x="320" y="259" width="40" height="72" rx="10"/>

    <circle cx="420" cy="232" r="23"/>
    <rect x="398" y="255" width="44" height="76" rx="11"/>
  </g>

  <!-- árvores -->
  <g fill="#2d6a4f">
    <rect x="80" y="250" width="12" height="80" rx="4"/>
    <circle cx="86" cy="240" r="34"/>

    <rect x="520" y="260" width="12" height="70" rx="4"/>
    <circle cx="526" cy="250" r="30"/>
  </g>

  <text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0b2e23">
    Comunidade Sementes do Amanhã
  </text>
</svg>